<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Copertine Matematica in Rete</title>
<style>
/* Interfaccia neutra e discreta: il colore lo mette solo la copertina. */
:root {
  --tela: #EBEBEB;
  --superficie: #FFFFFF;
  --incavo: #F1F1F1;
  --rilievo: #FFFFFF;
  --linea: #E4E4E4;
  --linea-forte: #C8C8C8;
  --inchiostro: #1A1A1A;
  --spento: #6B6B6B;
  --su-inchiostro: #FFFFFF;
  --ok: #1A7F4B;
  --attenzione: #A36400;
  --errore: #C62233;
  --margine-s: max(16px, env(safe-area-inset-left, 0px));
  --margine-d: max(16px, env(safe-area-inset-right, 0px));
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --tela: #191919;
    --superficie: #242424;
    --incavo: #1C1C1C;
    --rilievo: #3A3A3A;
    --linea: #343434;
    --linea-forte: #4C4C4C;
    --inchiostro: #EFEFEF;
    --spento: #A3A3A3;
    --su-inchiostro: #1A1A1A;
    --ok: #4CC38A;
    --attenzione: #E0A63C;
    --errore: #FF7A85;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --tela: #191919;
  --superficie: #242424;
  --incavo: #1C1C1C;
  --rilievo: #3A3A3A;
  --linea: #343434;
  --linea-forte: #4C4C4C;
  --inchiostro: #EFEFEF;
  --spento: #A3A3A3;
  --su-inchiostro: #1A1A1A;
  --ok: #4CC38A;
  --attenzione: #E0A63C;
  --errore: #FF7A85;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--tela);
  color: var(--inchiostro);
  font: 400 13px/1.35 var(--font);
}
h1, h2, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--inchiostro); outline-offset: 1px; }

#app {
  height: 100%;
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr) 288px;
  grid-template-rows: auto minmax(0, 1fr);
}

/* Barra in alto: collana a sinistra, download sempre a portata di mano */
#top {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 48px;
  padding-block: 8px;
  padding-left: var(--margine-s);
  padding-right: var(--margine-d);
  background: var(--superficie);
  border-bottom: 1px solid var(--linea);
}
#top h1 { font-size: 14px; font-weight: 600; }
#exportBtns { display: flex; align-items: center; gap: 6px; margin-left: auto; }
#exportBtns .etichetta { margin-right: 2px; color: var(--spento); }

.segmenti {
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 2px;
  padding: 2px;
  background: var(--incavo);
  border-radius: 7px;
}
.segmenti button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 4px 10px;
  background: transparent;
  border: 0;
  border-radius: 5px;
  color: var(--spento);
  white-space: nowrap;
  cursor: pointer;
}
.segmenti button:hover { color: var(--inchiostro); }
.segmenti button[aria-pressed="true"] {
  background: var(--rilievo);
  color: var(--inchiostro);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .14);
}
.chip-colore { flex: none; width: 8px; height: 8px; border-radius: 50%; }

.btn {
  padding: 4px 10px;
  background: var(--superficie);
  border: 1px solid var(--linea-forte);
  border-radius: 6px;
  line-height: 1.35;
  white-space: nowrap;
  cursor: pointer;
}
.btn:hover:not(:disabled) { background: var(--incavo); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primario { background: var(--inchiostro); border-color: var(--inchiostro); color: var(--su-inchiostro); }
.btn.primario:hover:not(:disabled) { background: var(--inchiostro); opacity: .85; }
.ghost {
  padding: 2px 6px;
  background: transparent;
  border: 0;
  border-radius: 5px;
  color: var(--spento);
  font-size: 12px;
  white-space: nowrap;
  cursor: pointer;
}
.ghost:hover:not(:disabled) { background: var(--incavo); color: var(--inchiostro); }

/* Elenco copertine */
#list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  padding-block: 14px;
  padding-left: var(--margine-s);
  padding-right: 12px;
  overflow: auto;
  background: var(--superficie);
  border-right: 1px solid var(--linea);
}
#coverList { display: flex; flex-direction: column; gap: 12px; }
.cover-item {
  display: grid;
  gap: 4px;
  padding: 0;
  background: none;
  border: 0;
  color: var(--spento);
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}
.cover-item canvas { display: block; width: 100%; height: auto; box-shadow: 0 0 0 1px var(--linea); }
.cover-item:hover canvas { box-shadow: 0 0 0 1px var(--linea-forte); }
.cover-item[aria-current="true"] { color: var(--inchiostro); }
.cover-item[aria-current="true"] canvas { box-shadow: 0 0 0 2px var(--inchiostro); }
#btnNew { align-self: flex-start; margin-left: -6px; }

/* Tavola */
#stage {
  position: relative;
  display: grid;
  place-items: center;
  min-width: 0;
  min-height: 0;
  padding: 44px 32px 28px;
  overflow: hidden;
}
#stage.drop { outline: 2px dashed var(--linea-forte); outline-offset: -10px; }
#sheet { position: relative; line-height: 0; }
#sheetBar {
  position: absolute;
  left: 0;
  right: 0;
  top: -30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  height: 24px;
  line-height: 1.2;
}
#sheetLabel { min-width: 0; overflow: hidden; color: var(--spento); font-size: 12px; white-space: nowrap; text-overflow: ellipsis; }
#sheetBar .azioni { display: flex; flex: none; gap: 2px; margin-right: -6px; }
#preview { display: block; box-shadow: 0 1px 2px rgba(0, 0, 0, .1), 0 6px 20px rgba(0, 0, 0, .08); }
#slotHit { position: absolute; touch-action: none; cursor: grab; }
#slotHit.vuoto { cursor: pointer; touch-action: auto; }
#slotHit.dragging { cursor: grabbing; }

/* Pannello */
#panel { min-height: 0; overflow: auto; background: var(--superficie); border-left: 1px solid var(--linea); }
#panel section {
  display: grid;
  gap: 10px;
  padding-block: 14px;
  padding-left: 16px;
  padding-right: var(--margine-d);
  border-bottom: 1px solid var(--linea);
}
#panel h2 { font-size: 12px; font-weight: 600; }
.sez-testa, .riga-spazio { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sez-testa .ghost { margin-right: -6px; }
#fields { display: grid; gap: 8px; }
.field { display: grid; gap: 3px; }
.field label, .control label, .riga-spazio .nome { color: var(--spento); font-size: 12px; }
.field textarea {
  display: block;
  width: 100%;
  padding: 5px 7px;
  resize: none;
  field-sizing: content;
  background: var(--superficie);
  border: 1px solid var(--linea-forte);
  border-radius: 5px;
  line-height: 1.3;
}
.field textarea:focus-visible { outline: 1px solid var(--inchiostro); outline-offset: 0; border-color: var(--inchiostro); }
.problema { color: var(--errore); font-size: 12px; }
fieldset { display: grid; gap: 8px; min-width: 0; margin: 0; padding: 0; border: 0; }
fieldset:disabled { opacity: .4; }
.riga-fine { display: flex; justify-content: flex-end; margin-right: -6px; }
.riga { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
#btnUpload { justify-self: stretch; }

#imgInfo { display: grid; gap: 2px; min-width: 0; color: var(--spento); font-size: 12px; overflow-wrap: anywhere; }
.chip { display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.chip::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--ok); }
.chip.attenzione { color: var(--attenzione); }
.chip.errore { color: var(--errore); }
.nota { color: var(--spento); font-size: 12px; overflow-wrap: anywhere; }
#savedNote { padding: 12px var(--margine-d) 16px 16px; }

.control { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; align-items: baseline; }
.control output { color: var(--spento); font-size: 12px; font-variant-numeric: tabular-nums; }
.control .pista { grid-column: 1 / -1; position: relative; }
.control .pista.bipolare::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 5px;
  width: 1px;
  height: 8px;
  background: var(--linea-forte);
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  display: block;
  width: 100%;
  height: 18px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--linea-forte); border-radius: 1px; }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  margin-top: -5px;
  background: var(--inchiostro);
  border-radius: 50%;
}
input[type="range"]::-moz-range-track { height: 2px; background: var(--linea-forte); border-radius: 1px; }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; background: var(--inchiostro); border: 0; border-radius: 50%; }
.spunta { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.spunta input { width: 14px; height: 14px; margin: 0; accent-color: var(--inchiostro); }

#status {
  position: fixed;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 2;
  width: max-content;
  max-width: min(calc(100vw - 32px), 460px);
  padding: 6px 12px;
  transform: translateX(-50%);
  background: var(--inchiostro);
  border-radius: 6px;
  color: var(--su-inchiostro);
  font-size: 12px;
  text-align: center;
  overflow-wrap: anywhere;
}
#status:empty { display: none; }
#status.errore { background: var(--errore); color: var(--superficie); }

@media (max-width: 980px) {
  html, body { height: auto; }
  #app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  #top { flex-wrap: wrap; gap: 8px 12px; }
  #seriesTabs { order: 3; width: 100%; }
  #seriesTabs button { gap: 4px; padding-inline: 2px; font-size: 12px; }
  #exportBtns .etichetta { display: none; }
  #list { padding-right: var(--margine-d); overflow: visible; border-right: 0; border-bottom: 1px solid var(--linea); }
  #coverList { flex-direction: row; overflow-x: auto; padding: 2px; }
  .cover-item { flex: none; width: 64px; }
  #stage { padding: 44px var(--margine-d) 24px var(--margine-s); overflow: visible; }
  #panel { overflow: visible; border-left: 0; border-top: 1px solid var(--linea); }
  #panel section, #savedNote { padding-left: var(--margine-s); }
}
</style>

<div id="app">
  <header id="top">
    <h1>Copertine</h1>
    <div id="seriesTabs" class="segmenti" role="group" aria-label="Collana"></div>
    <div id="exportBtns" role="group" aria-label="Scarica la copertina">
      <span class="etichetta">Scarica</span>
      <button id="btnPng" class="btn" type="button" title="PNG, A4 a 300 dpi">PNG</button>
      <button id="btnJpg" class="btn" type="button" title="JPG, A4 a 300 dpi">JPG</button>
      <button id="btnWeb" class="btn" type="button" title="JPG leggero per il sito, 1240 × 1754 px">Web</button>
      <button id="btnPdf" class="btn primario" type="button" title="PDF, formato A4">PDF</button>
    </div>
  </header>

  <aside id="list" aria-label="Copertine della collana">
    <div id="coverList"></div>
    <button id="btnNew" class="ghost" type="button">+ Nuova</button>
  </aside>

  <main id="stage">
    <div id="sheet">
      <div id="sheetBar">
        <p id="sheetLabel"></p>
        <div class="azioni">
          <button id="btnDup" class="ghost" type="button">Duplica</button>
          <button id="btnAlt" class="ghost" type="button">Ripristina</button>
        </div>
      </div>
      <canvas id="preview" role="img"></canvas>
      <div id="slotHit"></div>
    </div>
  </main>

  <div id="panel">
    <section aria-labelledby="hTesti">
      <h2 id="hTesti">Testi</h2>
      <div id="fields"></div>
    </section>

    <section aria-labelledby="hImmagine">
      <div class="sez-testa">
        <h2 id="hImmagine">Immagine</h2>
        <button id="btnRemove" class="ghost" type="button">Togli</button>
      </div>
      <button id="btnUpload" class="btn" type="button">Carica immagine</button>
      <input id="file" type="file" accept="image/*,.svg" hidden>
      <p id="imgInfo"></p>
      <fieldset id="imgControls">
        <fieldset id="imgToni">
        <div class="control">
          <label for="exposure">Esposizione</label><output id="exposureOut" for="exposure">0</output>
          <div class="pista bipolare"><input id="exposure" type="range" min="-100" max="100" step="1" value="0"></div>
        </div>
        <div class="control">
          <label for="contrast">Contrasto</label><output id="contrastOut" for="contrast">0</output>
          <div class="pista bipolare"><input id="contrast" type="range" min="-100" max="100" step="1" value="0"></div>
        </div>
        <div class="riga-fine">
          <button id="btnNeutral" class="ghost" type="button" title="Azzera esposizione e contrasto">Azzera</button>
        </div>
        <div class="riga-spazio">
          <span class="nome">Fusione</span>
          <div class="segmenti" role="group" aria-label="Fusione con il fondo">
            <button id="blendMultiply" type="button" aria-pressed="true">Moltiplica</button>
            <button id="blendNormal" type="button" aria-pressed="false">Normale</button>
          </div>
        </div>
        </fieldset>
        <div class="control">
          <label for="zoom">Zoom</label><output id="zoomOut" for="zoom">100%</output>
          <div class="pista"><input id="zoom" type="range" min="-1.61" max="1.61" step="0.01" value="0"></div>
        </div>
        <div class="riga-spazio">
          <span class="nome">Adatta</span>
          <div class="riga">
            <button id="btnFill" class="ghost" type="button" title="L'immagine copre tutto lo spazio">Riempi</button>
            <button id="btnFit" class="ghost" type="button" title="L'immagine si vede tutta">Intera</button>
          </div>
        </div>
      </fieldset>
      <p class="nota">Sulla tavola: trascina per spostare, rotella per lo zoom. Puoi anche rilasciarci un file.</p>
    </section>

    <p id="savedNote" class="nota">Le copertine restano solo in questo browser.</p>
  </div>
</div>
<p id="status" role="status" aria-live="polite"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="immagini-esempio.js"></script>
<script src="font-copertine.js"></script>
<script>
(() => {
'use strict';

/* ---------- Gabbia e colori, dal file Figma "Matematica In Rete" ---------- */

const PAGE = { w: 595, h: 841.5 };                 // A4 esatto su base 595 (la tavola Figma arrotonda a 842); 1 unità ≈ 1/72 di pollice
const EXPORT = { w: 2480, h: 3508, dpi: 300 };     // A4 a 300 dpi
const WEB = { w: 1240, h: 1754, dpi: 150 };        // JPG leggero per il sito, metà esatta di EXPORT
const PDF_PAGE = { w: 595.2756, h: 841.8898 };     // A4 in punti
const TEXT_DPI = 1200;                             // testo nel PDF se fontkit non si carica
const FONTKIT_URL = 'https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js';
const FONT_STACK = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const ASCENT = 0.975, DESCENT = 0.217;             // metriche di Helvetica Neue Medium

const TITOLO = { size: 40, lh: 42, ls: 0 };
const PICCOLO = { size: 20, lh: 20, ls: -0.05 };
const AUTORE = { size: 20, lh: 20, ls: 0.15 };

// In Figma il fondo di LAB è un colore al 50% sulla tela #E5E5E5: qui c'è il risultato che si vede.
const SERIES = {
  labm: { label: 'LAB Matematica', prefix: 'LAB M', bg: '#F0D052', grid: 'lab' },
  labf: { label: 'LAB Fisica', prefix: 'LAB F', bg: '#85CF85', grid: 'lab' },
  corso: { label: 'Corso', prefix: 'CORSO ', bg: '#FF7782', grid: 'corso' },
};

// La cornice dista 24 dal bordo della pagina su tutti e quattro i lati.
const GRIDS = {
  lab: {
    slot: { x: 24, y: 272, w: 547, h: 543.5 },
    rules: [[24, 272, 547, 545.5], [24, 24, 547, 250]],
    fields: [
      { key: 'title', label: 'Titolo', rows: 3, ...TITOLO, align: 'left', x: 39, w: 286, top: 34, limit: [26, 268] },
      { key: 'subtitle', label: 'Sottotitolo', rows: 3, ...PICCOLO, align: 'left', x: 339, w: 219, top: 38, limit: [26, 268] },
      { key: 'author', label: 'Autori', rows: 2, ...AUTORE, align: 'left', x: 339, w: 219, bottom: 255, limit: [26, 268] },
    ],
  },
  corso: {
    slot: { x: 24, y: 262, w: 547, h: 499.5 },
    rules: [[24, 761.5, 547, 56], [24, 206, 547, 56], [24, 24, 547, 56], [24, 78, 547, 130], [24, 24, 547, 793.5]],
    // Testata fissa della collana. I due testi distano dalla cornice lo stesso spazio misurato sull'inchiostro.
    fixed: [
      { text: 'Matematica in Rete', ...PICCOLO, align: 'left', x: 42.1, w: 250, top: 42 },
      { text: 'Formazione Docenti', ...PICCOLO, align: 'right', x: 552.5, w: 250, top: 42 },
    ],
    fields: [
      { key: 'title', label: 'Titolo', rows: 2, ...TITOLO, align: 'center', x: 297.5, w: 506, middle: 143, limit: [80, 206] },
      { key: 'subtitle', label: 'Sottotitolo', rows: 2, ...PICCOLO, align: 'center', x: 297.5, w: 453, middle: 234, limit: [208, 260] },
      { key: 'author', label: 'Autori', rows: 1, ...AUTORE, align: 'center', x: 297.5, w: 506, middle: 789.5, limit: [763.5, 815.5] },
    ],
  },
};

const NEUTRO = { exposure: 0, contrast: 0, blend: 'multiply' };
const ZOOM_MIN = 0.2, ZOOM_MAX = 5;
const ESEMPI = window.COPERTINE_ESEMPI || {};

const esempio = (id, series, code, ref, texts, extra = {}) => ({
  id, preset: true, series, code, texts,
  image: { kind: 'preset', ref, name: 'Immagine da Figma' },
  adj: { ...NEUTRO }, view: { zoom: 1, x: 0, y: 0 },
  ...extra,
});
const CM = 'Cecilia Magni';
const PRESETS = [
  esempio('lab-m1', 'labm', 'LAB M1', 'm1', { title: 'Matematica\ncon Geogebra', subtitle: 'Schede di lavoro\nper il Biennio\ndei Licei', author: CM }),
  esempio('lab-m2', 'labm', 'LAB M2', 'm2', { title: 'Matematica\ncon Geogebra', subtitle: 'Schede di lavoro\nper il Triennio\ndei Licei', author: CM }),
  esempio('lab-m3', 'labm', 'LAB M3', 'm3', { title: 'Attività sul Calcolo delle\nProbabilità', subtitle: 'Scuola secondaria superiore', author: CM }),
  esempio('lab-f1', 'labf', 'LAB F1', 'f1', { title: 'Fisica in\nLaboratorio', subtitle: 'Schede operative\nper la scuola secondaria superiore', author: CM }),
  esempio('lab-f2', 'labf', 'LAB F2', 'f2', { title: 'Esperienze\ndi Fisica', subtitle: 'Per il biennio della scuola secondaria superiore', author: CM + '\nDelia Noferi' }),
  esempio('corso-1', 'corso', 'CORSO 1', 'corso', { title: 'Geometria Euclidea\ncon Geogebra', subtitle: 'Classe prima della seconda superiore', author: CM }, {
    view: { zoom: 0.760693, x: 0.45, y: -1.233 },
  }),
];
const VUOTA = {
  lab: { title: 'Titolo\ndel volume', subtitle: 'Sottotitolo', author: CM },
  corso: { title: 'Titolo\ndel corso', subtitle: 'Classe e indirizzo', author: CM },
};

/* ---------- Stato ---------- */

const $ = (id) => document.getElementById(id);
const clone = (o) => structuredClone(o);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const state = { covers: PRESETS.map(clone), currentId: 'lab-m1', lastBySeries: {} };
const current = () => state.covers.find((c) => c.id === state.currentId);
const gridOf = (cover) => GRIDS[SERIES[cover.series].grid];

/* Salvataggio nel browser: comodità, la pagina funziona anche senza. */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((ok, ko) => {
    const r = indexedDB.open('copertine-mir', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ko(r.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((ok, ko) => {
      const t = db.transaction('kv', mode);
      const q = fn(t.objectStore('kv'));
      t.oncomplete = () => ok(q.result);
      t.onerror = t.onabort = () => ko(t.error);
    });
  };
  return {
    get: (k) => run('readonly', (s) => s.get(k)).catch(() => undefined),
    set: (k, v) => run('readwrite', (s) => s.put(v, k)).catch(() => undefined),
    del: (k) => run('readwrite', (s) => s.delete(k)).catch(() => undefined),
  };
})();

let saveTimer = 0, thumbTimer = 0;
function touched() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.set('stato', { v: 1, covers: state.covers, currentId: state.currentId, lastBySeries: state.lastBySeries }), 400);
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(refreshThumbs, 200);
}

/* ---------- Immagini ---------- */

const assets = new Map();
const pending = new Map();

const assetKey = (cover) => {
  const im = cover.image;
  if (!im) return null;
  return im.kind === 'preset' ? 'p:' + im.ref : 'u:' + im.id;
};

function withIntrinsicSize(svgText) {
  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  const root = doc.documentElement;
  if (root.nodeName.toLowerCase() !== 'svg') throw new Error('svg non valido');
  if (!parseFloat(root.getAttribute('width')) || !parseFloat(root.getAttribute('height'))) {
    const vb = (root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
    root.setAttribute('width', vb[2] || 1000);
    root.setAttribute('height', vb[3] || 1000);
  }
  return new XMLSerializer().serializeToString(doc);
}

async function loadAsset(image) {
  let url, svgText = null;
  if (image.kind === 'preset') {
    url = ESEMPI[image.ref];
    if (!url) throw new Error('immagine di esempio mancante');
    if (url.startsWith('data:image/svg')) {
      svgText = new TextDecoder().decode(Uint8Array.from(atob(url.split(',')[1]), (c) => c.charCodeAt(0)));
    }
  } else if (image.svg) {
    svgText = withIntrinsicSize(await image.blob.text());
    url = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml' }));
  } else {
    url = URL.createObjectURL(image.blob);
  }
  const el = new Image();
  await new Promise((ok, ko) => { el.onload = ok; el.onerror = () => ko(new Error('immagine illeggibile')); el.src = url; });
  const w = el.naturalWidth, h = el.naturalHeight;
  if (!w || !h) throw new Error('immagine vuota');
  // Copia ridotta per l'anteprima: i file molto grandi restano fluidi mentre si trascina.
  let proxy = el, proxyScale = 1;
  const lato = 2000;
  if (!svgText && Math.max(w, h) > lato) {
    proxyScale = lato / Math.max(w, h);
    proxy = document.createElement('canvas');
    proxy.width = Math.round(w * proxyScale);
    proxy.height = Math.round(h * proxyScale);
    const x = proxy.getContext('2d');
    x.imageSmoothingQuality = 'high';
    x.drawImage(el, 0, 0, proxy.width, proxy.height);
  }
  return { el, w, h, svgText, proxy, proxyScale };
}

function ensureAsset(cover) {
  const key = assetKey(cover);
  if (!key) return Promise.resolve(null);
  if (assets.has(key)) return Promise.resolve(assets.get(key));
  if (!pending.has(key)) {
    const p = loadAsset(cover.image).then((a) => { assets.set(key, a); return a; }).finally(() => pending.delete(key));
    pending.set(key, p);
    p.then(() => { invalidate(); refreshThumbs(); syncImageUI(); }, () => {});
  }
  return pending.get(key);
}
function getAsset(cover) {
  const key = assetKey(cover);
  if (!key) return null;
  if (assets.has(key)) return assets.get(key);
  ensureAsset(cover).catch(() => {});
  return null;
}

function placement(cover, asset, slot) {
  const s = Math.max(slot.w / asset.w, slot.h / asset.h) * cover.view.zoom;
  const dw = asset.w * s, dh = asset.h * s;
  return { s, dw, dh, dx: (slot.w - dw) / 2 + cover.view.x, dy: (slot.h - dh) / 2 + cover.view.y };
}
// L'immagine resta ancorata: se è più grande dello spazio lo copre sempre, se è più piccola ci resta dentro.
function clampView(cover, asset) {
  const slot = gridOf(cover).slot;
  const { dw, dh } = placement(cover, asset, slot);
  const mx = Math.abs(dw - slot.w) / 2, my = Math.abs(dh - slot.h) / 2;
  cover.view.x = clamp(cover.view.x, -mx, mx);
  cover.view.y = clamp(cover.view.y, -my, my);
}

/* Esposizione: ±100 = ±2 stop in luce lineare. Contrasto: pendenza attorno al grigio medio. */
const toLinear = (v) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
const toSrgb = (v) => (v <= 0.0031308 ? v * 12.92 : 1.055 * v ** (1 / 2.4) - 0.055);
let lutKey = '', lutCache = null;
function lutFor(exposure, contrast) {
  const key = exposure + '|' + contrast;
  if (key === lutKey) return lutCache;
  const gain = 2 ** (exposure / 50);
  const slope = contrast >= 0 ? 1 + contrast / 50 : 1 + contrast / 125;
  const lut = new Uint8ClampedArray(256);
  for (let i = 0; i < 256; i++) {
    const v = toSrgb(clamp(toLinear(i / 255) * gain, 0, 1));
    lut[i] = Math.round(clamp((v - 0.5) * slope + 0.5, 0, 1) * 255);
  }
  lutKey = key; lutCache = lut;
  return lut;
}

// Disegna l'immagine regolata nello spazio previsto, senza fondo: la fusione avviene dopo.
// Immagini sempre in bianco e nero; le figure vettoriali di Corso hanno sempre il riempimento nero.
const luma = (r, g, b) => (r * 54 + g * 183 + b * 19) >> 8;
const isFigura = (cover, asset) => cover.series === 'corso' && !!asset && !!asset.svgText;
function paintSlot(cover, asset, slot, k, target) {
  const W = Math.max(1, Math.round(slot.w * k)), H = Math.max(1, Math.round(slot.h * k));
  const c = target || document.createElement('canvas');
  if (c.width !== W) c.width = W;
  if (c.height !== H) c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.clearRect(0, 0, W, H);
  x.imageSmoothingEnabled = true;
  x.imageSmoothingQuality = 'high';
  const p = placement(cover, asset, slot);
  const fx = W / slot.w, fy = H / slot.h;
  const useProxy = asset.proxy !== asset.el && p.dw * fx <= asset.w * asset.proxyScale;
  x.drawImage(useProxy ? asset.proxy : asset.el, p.dx * fx, p.dy * fy, p.dw * fx, p.dh * fy);
  if (isFigura(cover, asset)) {
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = '#000';
    x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'source-over';
    return c;
  }
  const img = x.getImageData(0, 0, W, H), d = img.data, lut = lutFor(cover.adj.exposure, cover.adj.contrast);
  for (let i = 0; i < d.length; i += 4) {
    d[i] = d[i + 1] = d[i + 2] = lut[luma(d[i], d[i + 1], d[i + 2])];
  }
  x.putImageData(img, 0, 0);
  return c;
}

/* ---------- Testo ---------- */

let fontFamily = FONT_STACK;
const measureCtx = document.createElement('canvas').getContext('2d');
const MEASURE_SCALE = 10;
const canSpace = 'letterSpacing' in measureCtx;

function textWidth(text, f) {
  measureCtx.font = `500 ${f.size * MEASURE_SCALE}px ${fontFamily}`;
  measureCtx.fontKerning = 'normal';
  if ('textRendering' in measureCtx) measureCtx.textRendering = 'geometricPrecision';
  return measureCtx.measureText(text).width / MEASURE_SCALE + f.ls * text.length;
}

function layoutField(f, text) {
  const lines = [];
  for (const para of String(text || '').split('\n')) {
    const words = para.trim().split(/\s+/).filter(Boolean);
    if (!words.length) { lines.push(''); continue; }
    let line = words[0];
    for (const word of words.slice(1)) {
      const next = line + ' ' + word;
      if (textWidth(next, f) <= f.w) line = next;
      else { lines.push(line); line = word; }
    }
    lines.push(line);
  }
  while (lines.length && !lines[lines.length - 1]) lines.pop();
  const n = lines.length;
  const top = f.top != null ? f.top : f.bottom != null ? f.bottom - n * f.lh : f.middle - n * f.lh / 2;
  const baselineOffset = (f.lh - (ASCENT + DESCENT) * f.size) / 2 + ASCENT * f.size;
  const out = lines.map((t, i) => {
    const w = t ? textWidth(t, f) : 0;
    const x = f.align === 'left' ? f.x : f.align === 'right' ? f.x - w : f.x - w / 2;
    return { text: t, w, x, baseline: top + i * f.lh + baselineOffset };
  });
  return { field: f, lines: out, top, bottom: top + n * f.lh };
}

function layoutCover(cover) {
  const grid = gridOf(cover);
  const layouts = {}, problems = {};
  for (const f of grid.fields) {
    const l = layouts[f.key] = layoutField(f, cover.texts[f.key]);
    if (l.lines.some((line) => line.w > f.w + 0.5)) problems[f.key] = 'Una parola è più larga della colonna: accorciala o dividila.';
    else if (l.lines.length && (l.top < f.limit[0] || l.bottom > f.limit[1])) problems[f.key] = 'Il testo esce dallo spazio previsto: accorcialo.';
  }
  if (SERIES[cover.series].grid === 'lab' && layouts.subtitle.lines.length && layouts.author.lines.length
      && layouts.subtitle.bottom > layouts.author.top - 2) {
    problems.subtitle = problems.subtitle || 'Sottotitolo e autori si sovrappongono: accorcia uno dei due.';
  }
  return { layouts, problems };
}

// Tutti i testi da stampare: quelli fissi della collana e quelli della copertina.
function textBlocks(cover) {
  const grid = gridOf(cover), { layouts } = layoutCover(cover);
  return (grid.fixed || []).map((f) => layoutField(f, f.text)).concat(grid.fields.map((f) => layouts[f.key]));
}

function drawLine(ctx, line, f) {
  ctx.font = `500 ${f.size}px ${fontFamily}`;
  ctx.fontKerning = 'normal';
  if ('textRendering' in ctx) ctx.textRendering = 'geometricPrecision';
  if (canSpace || !f.ls) {
    if (canSpace) ctx.letterSpacing = f.ls + 'px';
    ctx.fillText(line.text, line.x, line.baseline);
  } else {
    // Browser senza letterSpacing: posizioni carattere per carattere, crenatura compresa.
    for (let i = 0; i < line.text.length; i++) {
      const before = textWidth(line.text.slice(0, i), f);
      ctx.fillText(line.text[i], line.x + before, line.baseline);
    }
  }
}

/* ---------- Copertina su canvas ---------- */

function renderCover(ctx, cover, W, H, { hint = false, slotCanvas = null } = {}) {
  const k = W / PAGE.w, oy = (H - PAGE.h * k) / 2;
  const series = SERIES[cover.series], grid = gridOf(cover), slot = grid.slot;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = series.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(k, 0, 0, k, 0, oy);

  const asset = getAsset(cover);
  if (asset) {
    const sc = paintSlot(cover, asset, slot, k, slotCanvas);
    ctx.save();
    ctx.globalCompositeOperation = cover.adj.blend === 'normal' ? 'source-over' : 'multiply';
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(sc, slot.x, slot.y, slot.w, slot.h);
    ctx.restore();
  } else if (hint && !cover.image) {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    const f = AUTORE, t = "Rilascia qui un'immagine";
    ctx.font = `500 ${f.size}px ${fontFamily}`;
    ctx.fillText(t, slot.x + (slot.w - textWidth(t, f)) / 2, slot.y + slot.h / 2);
  }

  ctx.fillStyle = '#000';
  for (const [x, y, w, h] of grid.rules) {
    ctx.fillRect(x, y, w, 2);
    ctx.fillRect(x, y + h - 2, w, 2);
    ctx.fillRect(x, y, 2, h);
    ctx.fillRect(x + w - 2, y, 2, h);
  }

  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  for (const block of textBlocks(cover)) for (const line of block.lines) if (line.text) drawLine(ctx, line, block.field);
  ctx.restore();
}

/* ---------- Anteprima ---------- */

const preview = $('preview'), sheet = $('sheet'), stage = $('stage'), slotHit = $('slotHit');
const previewSlot = document.createElement('canvas');
let cssW = 0, dirty = false;

function fitSheet() {
  const cs = getComputedStyle(stage);
  const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const narrow = matchMedia('(max-width: 980px)').matches;
  const w = Math.max(160, Math.floor(narrow ? Math.min(availW, 560) : Math.min(availW, availH * PAGE.w / PAGE.h)));
  const h = Math.round(w * PAGE.h / PAGE.w);
  cssW = w;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  preview.style.width = w + 'px';
  preview.style.height = h + 'px';
  preview.width = Math.round(w * dpr);
  preview.height = Math.round(h * dpr);
  positionSlotHit();
  invalidate();
}
function positionSlotHit() {
  const c = current();
  if (!c || !cssW) return;
  const f = cssW / PAGE.w, s = gridOf(c).slot;
  Object.assign(slotHit.style, { left: s.x * f + 'px', top: s.y * f + 'px', width: s.w * f + 'px', height: s.h * f + 'px' });
}

function invalidate() {
  if (dirty) return;
  dirty = true;
  requestAnimationFrame(draw);
}
function draw() {
  dirty = false;
  const c = current();
  if (!c || !preview.width) return;
  renderCover(preview.getContext('2d'), c, preview.width, preview.height, { hint: true, slotCanvas: previewSlot });
  const firstLine = (c.texts.title || '').split('\n').join(' ');
  preview.setAttribute('aria-label', `Anteprima della copertina ${c.code}: ${firstLine}`);
  syncProblems(c);
}

/* ---------- Pannello ---------- */

function buildTabs() {
  const wrap = $('seriesTabs');
  for (const [id, s] of Object.entries(SERIES)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.series = id;
    const chip = document.createElement('span');
    chip.className = 'chip-colore';
    chip.style.background = s.bg;
    b.append(chip, s.label);
    b.addEventListener('click', () => selectSeries(id));
    wrap.append(b);
  }
}

function buildFields(cover) {
  const wrap = $('fields');
  wrap.textContent = '';
  for (const f of gridOf(cover).fields) {
    const box = document.createElement('div');
    box.className = 'field';
    const label = document.createElement('label');
    label.htmlFor = 'testo-' + f.key;
    label.textContent = f.label;
    const ta = document.createElement('textarea');
    ta.id = 'testo-' + f.key;
    ta.rows = f.rows;
    ta.value = cover.texts[f.key] || '';
    ta.addEventListener('input', () => { current().texts[f.key] = ta.value; invalidate(); touched(); });
    const warn = document.createElement('p');
    warn.className = 'problema';
    warn.id = 'problema-' + f.key;
    warn.hidden = true;
    ta.setAttribute('aria-describedby', warn.id);
    box.append(label, ta, warn);
    wrap.append(box);
  }
}

function syncProblems(cover) {
  const { problems } = layoutCover(cover);
  for (const f of gridOf(cover).fields) {
    const el = $('problema-' + f.key);
    if (!el) continue;
    el.hidden = !problems[f.key];
    el.textContent = problems[f.key] || '';
  }
}

function dpiChip(cover, asset) {
  if (asset.svgText) return { text: isFigura(cover, asset) ? 'Vettoriale, riempimento nero' : 'Vettoriale', cls: 'ok' };
  const dpi = Math.round(72 / placement(cover, asset, gridOf(cover).slot).s);
  if (dpi >= 250) return { text: `${dpi} dpi, adatta alla stampa`, cls: 'ok' };
  if (dpi >= 150) return { text: `${dpi} dpi, al limite per la stampa`, cls: 'attenzione' };
  return { text: `${dpi} dpi, bassa per la stampa`, cls: 'errore' };
}

const signed = (v) => (v > 0 ? '+' + v : v < 0 ? '−' + Math.abs(v) : '0');

function syncImageUI() {
  const c = current();
  if (!c) return;
  const has = !!c.image, asset = getAsset(c);
  $('imgControls').disabled = !has;
  $('imgToni').disabled = isFigura(c, asset);
  $('btnRemove').hidden = !has;
  $('btnUpload').textContent = has ? 'Sostituisci immagine' : 'Carica immagine';
  slotHit.classList.toggle('vuoto', !has);
  const info = $('imgInfo');
  info.textContent = '';
  if (has && asset) {
    const name = document.createElement('span');
    name.textContent = asset.svgText ? c.image.name : `${c.image.name}, ${asset.w} × ${asset.h} px`;
    const chipData = dpiChip(c, asset), chip = document.createElement('span');
    chip.className = 'chip ' + chipData.cls;
    chip.textContent = chipData.text;
    info.append(name, chip);
  } else if (!has) {
    info.textContent = 'Nessuna immagine: la zona resta del colore della collana.';
  }
  $('exposure').value = c.adj.exposure;
  $('contrast').value = c.adj.contrast;
  $('exposureOut').textContent = signed(c.adj.exposure);
  $('contrastOut').textContent = signed(c.adj.contrast);
  $('blendMultiply').setAttribute('aria-pressed', c.adj.blend !== 'normal');
  $('blendNormal').setAttribute('aria-pressed', c.adj.blend === 'normal');
  $('zoom').value = Math.log(c.view.zoom);
  $('zoomOut').textContent = Math.round(c.view.zoom * 100) + '%';
}

function syncPanel() {
  const c = current();
  buildFields(c);
  syncImageUI();
  syncProblems(c);
  $('btnAlt').textContent = c.preset ? 'Ripristina' : 'Elimina';
  $('sheetLabel').textContent = `${c.code} · A4, 210 × 297 mm`;
}

function renderList() {
  const c = current(), wrap = $('coverList');
  wrap.textContent = '';
  for (const cover of state.covers.filter((x) => x.series === c.series)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cover-item';
    b.setAttribute('aria-current', cover.id === c.id ? 'true' : 'false');
    const label = document.createElement('span');
    label.textContent = cover.code;
    const cv = document.createElement('canvas');
    cv.width = 232;
    cv.height = Math.round(232 * PAGE.h / PAGE.w);
    cv.dataset.cover = cover.id;
    b.append(cv, label);
    b.addEventListener('click', () => select(cover.id));
    wrap.append(b);
  }
  refreshThumbs();
}
function refreshThumbs() {
  for (const cv of document.querySelectorAll('canvas[data-cover]')) {
    const cover = state.covers.find((c) => c.id === cv.dataset.cover);
    if (cover) renderCover(cv.getContext('2d'), cover, cv.width, cv.height);
  }
}

function select(id) {
  state.currentId = id;
  const c = current();
  state.lastBySeries[c.series] = id;
  for (const b of $('seriesTabs').children) b.setAttribute('aria-pressed', b.dataset.series === c.series);
  renderList();
  syncPanel();
  positionSlotHit();
  invalidate();
  touched();
}
function selectSeries(series) {
  const last = state.lastBySeries[series];
  const target = state.covers.find((c) => c.id === last) || state.covers.find((c) => c.series === series);
  if (target) select(target.id);
}

function nextCode(series) {
  let n = 0;
  for (const c of state.covers) {
    if (c.series !== series) continue;
    const m = c.code.match(/(\d+)$/);
    if (m) n = Math.max(n, +m[1]);
  }
  return SERIES[series].prefix + (n + 1);
}

function newCover() {
  const series = current().series;
  const cover = {
    id: uid(), preset: false, series, code: nextCode(series),
    texts: { ...VUOTA[SERIES[series].grid] }, image: null,
    adj: { ...NEUTRO }, view: { zoom: 1, x: 0, y: 0 },
  };
  state.covers.push(cover);
  select(cover.id);
}
function duplicateCover() {
  const c = current();
  const copy = clone(c);
  copy.id = uid();
  copy.preset = false;
  copy.code = nextCode(c.series);
  state.covers.push(copy);
  select(copy.id);
}

// Conferma in due clic per le azioni che buttano via il lavoro.
let armed = null;
function confirmTwice(btn, label, action) {
  if (armed && armed.btn === btn) {
    clearTimeout(armed.timer);
    armed = null;
    action();
    return;
  }
  const original = btn.textContent;
  btn.textContent = label;
  armed = { btn, timer: setTimeout(() => { btn.textContent = original; armed = null; }, 3000) };
}

/* ---------- Caricamento immagine ---------- */

async function setImageFromFile(file) {
  const isSvg = file.type === 'image/svg+xml' || /\.svg$/i.test(file.name || '');
  if (!isSvg && !(file.type || '').startsWith('image/')) {
    setStatus('Questo file non è un\'immagine: usa JPG, PNG, WebP o SVG.', true);
    return;
  }
  const c = current();
  const before = { image: c.image, adj: c.adj, view: c.view };
  c.image = { kind: 'upload', id: uid(), blob: file, name: file.name || 'Immagine', svg: isSvg };
  c.adj = { ...NEUTRO };
  c.view = { zoom: 1, x: 0, y: 0 };
  try {
    await ensureAsset(c);
    setStatus('');
  } catch {
    Object.assign(c, before);
    setStatus('Non riesco a leggere questo file: usa JPG, PNG, WebP o SVG.', true);
  }
  syncImageUI();
  invalidate();
  touched();
}

/* ---------- Esportazione ---------- */

const toBlob = (canvas, type, q) => new Promise((ok, ko) => canvas.toBlob((b) => (b ? ok(b) : ko(new Error('canvas troppo grande'))), type, q));
const nextFrame = () => new Promise((ok) => setTimeout(ok, 30));

const crcTable = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (const b of bytes) c = crcTable[(c ^ b) & 255] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
// Così il file si apre come A4 a 300 dpi anche in InDesign o Photoshop.
function tagDpiPng(buf, dpi) {
  const src = new Uint8Array(buf), ppm = Math.round(dpi / 0.0254);
  const chunk = new Uint8Array(21), v = new DataView(chunk.buffer);
  v.setUint32(0, 9);
  chunk.set([0x70, 0x48, 0x59, 0x73], 4);
  v.setUint32(8, ppm); v.setUint32(12, ppm);
  chunk[16] = 1;
  v.setUint32(17, crc32(chunk.subarray(4, 17)));
  const at = 33; // firma (8) + IHDR (25)
  const out = new Uint8Array(src.length + chunk.length);
  out.set(src.subarray(0, at));
  out.set(chunk, at);
  out.set(src.subarray(at), at + chunk.length);
  return out;
}
function tagDpiJpeg(buf, dpi) {
  const b = new Uint8Array(buf);
  if (b[2] === 0xff && b[3] === 0xe0 && b[6] === 0x4a && b[7] === 0x46) {
    b[13] = 1;
    b[14] = dpi >> 8; b[15] = dpi & 255;
    b[16] = dpi >> 8; b[17] = dpi & 255;
  }
  return b;
}

async function buildRaster(cover, type, size = EXPORT, quality = 0.95) {
  await ensureAsset(cover);
  const c = document.createElement('canvas');
  c.width = size.w;
  c.height = size.h;
  renderCover(c.getContext('2d'), cover, size.w, size.h);
  await nextFrame();
  const blob = await toBlob(c, type, quality);
  const buf = await blob.arrayBuffer();
  const bytes = type === 'image/png' ? tagDpiPng(buf, size.dpi) : tagDpiJpeg(buf, size.dpi);
  return new Blob([bytes], { type });
}

/* Font incluso nel tool (font-copertine.js): lo stesso per anteprima, immagini e tracciati del PDF. */
const fontBytes = Uint8Array.from(atob(window.COPERTINE_FONT), (c) => c.charCodeAt(0));
let fontFace = null;
let fontkitReady = null;
function loadFontkit() {
  if (window.fontkit) return Promise.resolve();
  return fontkitReady || (fontkitReady = new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = FONTKIT_URL;
    s.onload = ok;
    s.onerror = () => { fontkitReady = null; ko(new Error('fontkit')); };
    document.head.append(s);
  }));
}
async function getFace() {
  if (fontFace) return fontFace;
  await loadFontkit();
  fontFace = window.fontkit.create(fontBytes);
  return fontFace;
}
async function loadCanvasFont() {
  try {
    const face = new FontFace('CopertinaFont', fontBytes, { weight: '500' });
    await face.load();
    document.fonts.add(face);
    fontFamily = '"CopertinaFont", ' + FONT_STACK;
  } catch { /* resta il font di sistema */ }
}

function pdfLinePath(face, text, ls) {
  const run = face.layout(text);
  let x = 0, d = '';
  run.glyphs.forEach((g, i) => {
    const p = run.positions[i];
    d += g.path.scale(1, -1).translate(x + p.xOffset, -p.yOffset).toSVG();
    x += p.xAdvance + ls;
  });
  return { d, width: x };
}

function parseSimpleSvg(text) {
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const root = doc.documentElement;
  if (root.nodeName.toLowerCase() !== 'svg' || doc.querySelector('parsererror')) return null;
  const vb = (root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  if (vb.length !== 4 || vb[0] || vb[1]) return null;
  const paths = [];
  for (const el of root.querySelectorAll('*')) {
    const tag = el.nodeName.toLowerCase();
    if (['transform', 'style', 'opacity', 'clip-path', 'mask', 'filter'].some((a) => el.hasAttribute(a))) return null;
    if (tag === 'g' || tag === 'title' || tag === 'desc') continue;
    if (tag !== 'path' || el.hasAttribute('stroke')) return null;
    const fill = el.getAttribute('fill') || '';
    if (!/^#[0-9a-f]{6}$/i.test(fill)) return null;
    paths.push({ d: el.getAttribute('d'), fill });
  }
  return paths.length ? { w: vb[2], paths } : null;
}

async function buildPdf(cover) {
  if (!window.PDFLib) throw new Error('pdf-lib');
  const { PDFDocument, PDFName, rgb, BlendMode, pushGraphicsState, popGraphicsState, rectangle, clip, endPath } = window.PDFLib;
  const hex = (h) => rgb(parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255);
  const nero = rgb(0, 0, 0);
  const asset = await ensureAsset(cover);
  const face = await getFace().catch(() => null);

  const doc = await PDFDocument.create();
  const page = doc.addPage([PDF_PAGE.w, PDF_PAGE.h]);
  // Gruppo di trasparenza in RGB: la moltiplica dà lo stesso colore in tutti i visualizzatori.
  page.node.set(PDFName.of('Group'), doc.context.obj({ Type: 'Group', S: 'Transparency', CS: 'DeviceRGB', I: true }));
  const S = PDF_PAGE.w / PAGE.w, oy = (PDF_PAGE.h - PAGE.h * S) / 2;
  const X = (x) => x * S, Y = (y) => PDF_PAGE.h - (oy + y * S);

  const series = SERIES[cover.series], grid = gridOf(cover), slot = grid.slot;
  page.drawRectangle({ x: 0, y: 0, width: PDF_PAGE.w, height: PDF_PAGE.h, color: hex(series.bg) });

  if (asset) {
    const blendMode = cover.adj.blend === 'normal' ? undefined : BlendMode.Multiply;
    const figura = isFigura(cover, asset);
    const plain = figura || (!cover.adj.exposure && !cover.adj.contrast);
    const vector = asset.svgText && plain ? parseSimpleSvg(asset.svgText) : null;
    if (vector) {
      const p = placement(cover, asset, slot), scale = p.dw * S / vector.w;
      page.pushOperators(pushGraphicsState(), rectangle(X(slot.x), Y(slot.y + slot.h), slot.w * S, slot.h * S), clip(), endPath());
      for (const path of vector.paths) {
        const { red, green, blue } = hex(path.fill);
        const v = luma(red * 255, green * 255, blue * 255) / 255;
        page.drawSvgPath(path.d, { x: X(slot.x + p.dx), y: Y(slot.y + p.dy), scale, color: figura ? nero : rgb(v, v, v), borderWidth: 0, blendMode });
      }
      page.pushOperators(popGraphicsState());
    } else {
      const sc = paintSlot(cover, asset, slot, EXPORT.w / PAGE.w);
      const data = sc.getContext('2d').getImageData(0, 0, sc.width, sc.height).data;
      let opaque = true;
      for (let i = 3; i < data.length; i += 4) if (data[i] !== 255) { opaque = false; break; }
      const blob = await toBlob(sc, opaque ? 'image/jpeg' : 'image/png', 0.92);
      const buf = await blob.arrayBuffer();
      const image = opaque ? await doc.embedJpg(buf) : await doc.embedPng(buf);
      page.drawImage(image, { x: X(slot.x), y: Y(slot.y + slot.h), width: slot.w * S, height: slot.h * S, blendMode });
    }
  }

  for (const [x, y, w, h] of grid.rules) {
    page.drawRectangle({ x: X(x + 1), y: Y(y + h - 1), width: (w - 2) * S, height: (h - 2) * S, borderWidth: 2 * S, borderColor: nero });
  }

  for (const block of textBlocks(cover)) {
    const f = block.field;
    const lines = block.lines.filter((l) => l.text);
    if (!lines.length) continue;
    if (face) {
      // Testo in tracciati: niente font da incorporare, identico in ogni visualizzatore e in tipografia.
      const unit = f.size / face.unitsPerEm;
      for (const line of lines) {
        const { d, width } = pdfLinePath(face, line.text, f.ls / unit);
        const w = width * unit;
        const x = f.align === 'left' ? f.x : f.align === 'right' ? f.x - w : f.x - w / 2;
        page.drawSvgPath(d, { x: X(x), y: Y(line.baseline), scale: unit * S, color: nero, borderWidth: 0 });
      }
    } else {
      const K = TEXT_DPI / 72, pad = 4;
      const bx = Math.min(...lines.map((l) => l.x)) - pad;
      const bw = Math.max(...lines.map((l) => l.x + l.w)) + pad - bx;
      const by = lines[0].baseline - f.size - pad;
      const bh = lines[lines.length - 1].baseline + f.size * 0.3 + pad - by;
      const c = document.createElement('canvas');
      c.width = Math.ceil(bw * K);
      c.height = Math.ceil(bh * K);
      const ctx = c.getContext('2d');
      ctx.setTransform(K, 0, 0, K, -bx * K, -by * K);
      ctx.fillStyle = '#000';
      ctx.textBaseline = 'alphabetic';
      for (const line of lines) drawLine(ctx, line, f);
      const image = await doc.embedPng(await (await toBlob(c, 'image/png')).arrayBuffer());
      page.drawImage(image, { x: X(bx), y: Y(by + c.height / K), width: (c.width / K) * S, height: (c.height / K) * S });
    }
  }

  const titolo = (cover.texts.title || cover.code).split('\n').join(' ');
  doc.setTitle(titolo);
  doc.setAuthor((cover.texts.author || '').split('\n').join(', '));
  doc.setCreator('Copertine Matematica in Rete');
  return new Blob([await doc.save()], { type: 'application/pdf' });
}

function fileName(cover, ext, suffix = '') {
  const slug = (cover.texts.title || 'copertina').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48);
  return `${cover.code.replace(/\s+/g, '-')}_${slug}${suffix}.${ext}`;
}

const downloadsReady = (window.claude && window.claude.use) ? window.claude.use('downloads') : Promise.resolve(null);
async function saveFile(name, blob) {
  const downloads = await downloadsReady.catch(() => null);
  if (downloads) {
    await downloads.save({ filename: name, data: blob });
    return;
  }
  if (window.top !== window.self) {
    const e = new Error('non disponibile');
    e.code = 'unavailable';
    throw e;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

// Avviso a comparsa: sparisce da solo, tranne quando un'operazione è ancora in corso.
let statusTimer = 0;
function setStatus(text, isError = false, sticky = false) {
  const el = $('status');
  clearTimeout(statusTimer);
  el.textContent = text;
  el.classList.toggle('errore', isError);
  if (text && !sticky) statusTimer = setTimeout(() => setStatus(''), isError ? 10000 : 4000);
}
const exportButtons = ['btnPdf', 'btnPng', 'btnJpg', 'btnWeb'];
async function runExport(ext, label, build, suffix) {
  const cover = current();
  for (const id of exportButtons) $(id).disabled = true;
  setStatus(`Preparo il ${label}…`, false, true);
  try {
    await nextFrame();
    const blob = await build(cover);
    const name = fileName(cover, ext, suffix);
    setStatus(`${label} pronto, ${(blob.size / 1048576).toFixed(1).replace('.', ',')} MB: conferma il salvataggio.`, false, true);
    await saveFile(name, blob);
    setStatus(`Salvato: ${name}`);
  } catch (err) {
    const code = err && err.code;
    if (code === 'declined') setStatus('Salvataggio annullato.');
    else if (code === 'rate_limited') setStatus('C\'è già una richiesta di salvataggio aperta: rispondi a quella e riprova.', true);
    else if (code === 'unavailable' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') setStatus('Il salvataggio dei file non è disponibile in questa vista.', true);
    else if (err && err.message === 'pdf-lib') setStatus('Non riesco a caricare il modulo PDF: controlla la connessione e ricarica la pagina.', true);
    else setStatus(`Non riesco a creare il ${label}. ${err && err.message ? err.message : ''}`, true);
  } finally {
    for (const id of exportButtons) $(id).disabled = false;
  }
}

/* ---------- Interazione ---------- */

function bindControls() {
  $('btnNew').addEventListener('click', newCover);
  $('btnDup').addEventListener('click', duplicateCover);
  $('btnAlt').addEventListener('click', () => {
    const c = current();
    if (c.preset) {
      confirmTwice($('btnAlt'), 'Conferma', () => {
        Object.assign(c, clone(PRESETS.find((p) => p.id === c.id)));
        select(c.id);
      });
    } else {
      confirmTwice($('btnAlt'), 'Conferma', () => {
        state.covers = state.covers.filter((x) => x.id !== c.id);
        const next = state.covers.filter((x) => x.series === c.series).pop();
        select(next.id);
      });
    }
  });

  $('btnUpload').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (file) setImageFromFile(file);
  });
  $('btnRemove').addEventListener('click', () => {
    current().image = null;
    syncImageUI(); invalidate(); touched();
  });

  const onAdj = (key, input) => input.addEventListener('input', () => {
    current().adj[key] = +input.value;
    $(key + 'Out').textContent = signed(+input.value);
    invalidate(); touched();
  });
  onAdj('exposure', $('exposure'));
  onAdj('contrast', $('contrast'));
  for (const key of ['exposure', 'contrast']) {
    $(key).addEventListener('dblclick', () => { current().adj[key] = 0; syncImageUI(); invalidate(); touched(); });
  }
  const setBlend = (blend) => { current().adj.blend = blend; syncImageUI(); invalidate(); touched(); };
  $('blendMultiply').addEventListener('click', () => setBlend('multiply'));
  $('blendNormal').addEventListener('click', () => setBlend('normal'));

  const applyView = () => { const c = current(), a = getAsset(c); if (a) clampView(c, a); syncImageUI(); invalidate(); touched(); };
  $('zoom').addEventListener('input', (e) => { current().view.zoom = Math.exp(+e.target.value); applyView(); });
  $('btnFill').addEventListener('click', () => { current().view = { zoom: 1, x: 0, y: 0 }; applyView(); });
  $('btnFit').addEventListener('click', () => {
    const c = current(), a = getAsset(c), s = gridOf(c).slot;
    if (!a) return;
    c.view = { zoom: Math.min(s.w / a.w, s.h / a.h) / Math.max(s.w / a.w, s.h / a.h), x: 0, y: 0 };
    applyView();
  });
  $('btnNeutral').addEventListener('click', () => {
    const c = current();
    c.adj.exposure = 0; c.adj.contrast = 0;
    syncImageUI(); invalidate(); touched();
  });

  // Spostamento e zoom direttamente sulla tavola
  let drag = null;
  slotHit.addEventListener('click', () => { if (!current().image) $('file').click(); });
  slotHit.addEventListener('pointerdown', (e) => {
    if (!getAsset(current())) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
    slotHit.setPointerCapture(e.pointerId);
    slotHit.classList.add('dragging');
  });
  slotHit.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const c = current(), f = PAGE.w / cssW;
    c.view.x += (e.clientX - drag.x) * f;
    c.view.y += (e.clientY - drag.y) * f;
    drag.x = e.clientX; drag.y = e.clientY;
    clampView(c, getAsset(c));
    invalidate();
  });
  const endDrag = () => {
    if (!drag) return;
    drag = null;
    slotHit.classList.remove('dragging');
    touched();
  };
  slotHit.addEventListener('pointerup', endDrag);
  slotHit.addEventListener('pointercancel', endDrag);
  slotHit.addEventListener('wheel', (e) => {
    const c = current(), a = getAsset(c);
    if (!a) return;
    e.preventDefault();
    const s = gridOf(c).slot, r = slotHit.getBoundingClientRect(), f = s.w / r.width;
    const px = (e.clientX - r.left) * f - s.w / 2, py = (e.clientY - r.top) * f - s.h / 2;
    const z0 = c.view.zoom, z1 = clamp(z0 * Math.exp(-e.deltaY * 0.002), ZOOM_MIN, ZOOM_MAX), ratio = z1 / z0;
    c.view.x = px - (px - c.view.x) * ratio;
    c.view.y = py - (py - c.view.y) * ratio;
    c.view.zoom = z1;
    clampView(c, a);
    syncImageUI(); invalidate(); touched();
  }, { passive: false });

  // Un clic su un testo della tavola porta al suo campo
  const fieldAt = (e) => {
    const c = current(), r = preview.getBoundingClientRect(), f = PAGE.w / r.width;
    const x = (e.clientX - r.left) * f, y = (e.clientY - r.top) * f, pad = 6;
    const { layouts } = layoutCover(c);
    for (const key of Object.keys(layouts)) {
      const l = layouts[key];
      if (!l.lines.length) continue;
      const x0 = Math.min(...l.lines.map((n) => n.x)), x1 = Math.max(...l.lines.map((n) => n.x + n.w));
      if (x >= x0 - pad && x <= x1 + pad && y >= l.top - pad && y <= l.bottom + pad) return key;
    }
    return null;
  };
  preview.addEventListener('click', (e) => { const key = fieldAt(e); if (key) $('testo-' + key).focus(); });
  preview.addEventListener('pointermove', (e) => { preview.style.cursor = fieldAt(e) ? 'text' : 'default'; });

  // File rilasciati sulla tavola
  const app = $('app');
  app.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('drop'); });
  app.addEventListener('dragleave', (e) => { if (e.target === app || !app.contains(e.relatedTarget)) stage.classList.remove('drop'); });
  app.addEventListener('drop', (e) => {
    e.preventDefault();
    stage.classList.remove('drop');
    const file = e.dataTransfer.files[0];
    if (file) setImageFromFile(file);
  });

  $('btnPdf').addEventListener('click', () => runExport('pdf', 'PDF', buildPdf));
  $('btnPng').addEventListener('click', () => runExport('png', 'PNG', (c) => buildRaster(c, 'image/png')));
  $('btnJpg').addEventListener('click', () => runExport('jpg', 'JPG', (c) => buildRaster(c, 'image/jpeg')));
  $('btnWeb').addEventListener('click', () => runExport('jpg', 'JPG per il web', (c) => buildRaster(c, 'image/jpeg', WEB, 0.88), '_web'));

  new ResizeObserver(fitSheet).observe(stage);
  window.addEventListener('resize', fitSheet);
}

async function restore() {
  const saved = await store.get('stato');
  if (saved && saved.v === 1 && Array.isArray(saved.covers)) {
    const byId = new Map(saved.covers.map((c) => [c.id, c]));
    const presets = PRESETS.map((p) => byId.get(p.id) || clone(p));
    state.covers = presets.concat(saved.covers.filter((c) => !c.preset));
    state.lastBySeries = saved.lastBySeries || {};
    select(state.covers.some((c) => c.id === saved.currentId) ? saved.currentId : 'lab-m1');
  }
  store.del('font');   // file scelto a mano nelle versioni precedenti
}

async function start() {
  await loadCanvasFont();
  buildTabs();
  bindControls();
  select(state.currentId);
  fitSheet();
  restore();
}
start();

if (location.hostname === 'localhost') {
  window.__copertine = { state, PRESETS, select, renderCover, buildPdf, buildRaster, layoutCover, ensureAsset, setImageFromFile, fileName, WEB, current, invalidate, syncImageUI, getFace, pdfLinePath, textWidth };
}
})();
